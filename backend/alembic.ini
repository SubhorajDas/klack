[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 60
revision_environment = false
sourceless = false
version_path_separator = os
output_encoding = utf-8

# DATABASE_URL is intentionally supplied by validated application settings.
# Keeping credentials out of this file also avoids ConfigParser percent escaping issues.
