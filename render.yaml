services:
  - type: keyvalue
    name: klack-realtime
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
  - type: web
    name: klack
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_PASSWORD_MAX_CONCURRENCY
        value: "1"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "0"
      - key: REALTIME_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: klack-realtime
          property: connectionString
      - key: REALTIME_MAX_CONNECTIONS
        value: "100"
      - key: FILES_STORAGE
        value: supabase
      - key: FILES_SCAN_REQUIRED
        value: "false"
      - key: FILES_MAX_BYTES
        value: "10485760"
      - key: FILES_WORKSPACE_QUOTA_BYTES
        value: "104857600"
      - key: FILES_S3_BUCKET
        value: klack-files
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_REFRESH_SECRET
        generateValue: true
      - key: AUTH_ACTION_SECRET
        generateValue: true
      - key: WORKSPACE_INVITATION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTH_TRUSTED_ORIGIN
        sync: false
      - key: AUTH_PUBLIC_WEB_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
