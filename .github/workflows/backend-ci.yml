name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".editorconfig"
      - ".env.example"
      - ".gitattributes"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend-ci.yml"
      - "compose.yaml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".editorconfig"
      - ".env.example"
      - ".gitattributes"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend-ci.yml"
      - "compose.yaml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: klack_test
          POSTGRES_USER: klack
          POSTGRES_PASSWORD: klack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klack -d klack_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      APP_NAME: klack-api-test
      APP_VERSION: ${{ github.sha }}
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://klack:klack_test@127.0.0.1:5432/klack_test
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose --env-file ../.env.example --file ../compose.yaml config --quiet

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.13.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check lockfile
        run: uv lock --check

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Upgrade database
        run: uv run alembic upgrade head

      - name: Check migration drift
        run: uv run alembic check

      - name: Test
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Build production container image
        run: docker build --target production --file Dockerfile .
