name: klack

x-backend-environment: &backend-environment
  # This Compose file is development-only. Host-run processes take APP_ENV from `.env`.
  APP_ENV: development
  APP_NAME: ${APP_NAME:-klack-api}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  APP_DEBUG: ${APP_DEBUG:-false}
  API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-klack}:${POSTGRES_PASSWORD:-klack_dev}@postgres:5432/${POSTGRES_DB:-klack}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
  DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
  DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-30000}
  HEALTHCHECK_TIMEOUT_SECONDS: ${HEALTHCHECK_TIMEOUT_SECONDS:-2}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
  AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET}
  AUTH_ACTION_SECRET: ${AUTH_ACTION_SECRET}
  AUTH_ISSUER: ${AUTH_ISSUER:-klack-api}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-klack-web}
  AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
  AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-2592000}
  AUTH_REFRESH_MIN_INTERVAL_SECONDS: ${AUTH_REFRESH_MIN_INTERVAL_SECONDS:-300}
  AUTH_TRUSTED_ORIGIN: ${AUTH_TRUSTED_ORIGIN:-http://127.0.0.1:8000}
  AUTH_PUBLIC_WEB_ORIGIN: ${AUTH_PUBLIC_WEB_ORIGIN:-http://127.0.0.1:3000}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_PASSWORD_MAX_CONCURRENCY: ${AUTH_PASSWORD_MAX_CONCURRENCY:-2}
  AUTH_MAX_ACTIVE_SESSIONS: ${AUTH_MAX_ACTIVE_SESSIONS:-10}
  AUTH_EMAIL_VERIFICATION_TTL_SECONDS: ${AUTH_EMAIL_VERIFICATION_TTL_SECONDS:-86400}
  AUTH_PASSWORD_RECOVERY_TTL_SECONDS: ${AUTH_PASSWORD_RECOVERY_TTL_SECONDS:-3600}
  AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
  AUTH_RATE_LIMIT_BLOCK_SECONDS: ${AUTH_RATE_LIMIT_BLOCK_SECONDS:-900}
  AUTH_REGISTRATION_RATE_LIMIT: ${AUTH_REGISTRATION_RATE_LIMIT:-5}
  AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-10}
  AUTH_EMAIL_ACTION_RATE_LIMIT: ${AUTH_EMAIL_ACTION_RATE_LIMIT:-5}
  AUTH_ACTION_COMPLETE_RATE_LIMIT: ${AUTH_ACTION_COMPLETE_RATE_LIMIT:-10}
  WORKSPACE_INVITATION_SECRET: ${WORKSPACE_INVITATION_SECRET:-development-workspace-invitation-secret-change-me-00004}
  WORKSPACE_INVITATION_TTL_SECONDS: ${WORKSPACE_INVITATION_TTL_SECONDS:-604800}
  IDENTITY_OUTBOX_BATCH_SIZE: ${IDENTITY_OUTBOX_BATCH_SIZE:-50}
  IDENTITY_OUTBOX_LEASE_SECONDS: ${IDENTITY_OUTBOX_LEASE_SECONDS:-300}
  IDENTITY_CLEANUP_RETENTION_SECONDS: ${IDENTITY_CLEANUP_RETENTION_SECONDS:-604800}
  IDENTITY_CLEANUP_BATCH_SIZE: ${IDENTITY_CLEANUP_BATCH_SIZE:-1000}
  IDENTITY_WORKER_POLL_SECONDS: ${IDENTITY_WORKER_POLL_SECONDS:-10}
  IDENTITY_CLEANUP_INTERVAL_SECONDS: ${IDENTITY_CLEANUP_INTERVAL_SECONDS:-3600}

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-klack}
      POSTGRES_USER: ${POSTGRES_USER:-klack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klack_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-klack} -d ${POSTGRES_DB:-klack}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *json-logging

  migrate:
    build:
      context: ./backend
      target: development
    restart: "no"
    working_dir: /app
    command: ["/opt/venv/bin/alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-klack}:${POSTGRES_PASSWORD:-klack_dev}@postgres:5432/${POSTGRES_DB:-klack}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logging

  api:
    build:
      context: ./backend
      target: development
    init: true
    restart: unless-stopped
    working_dir: /app
    command:
      - /opt/venv/bin/uvicorn
      - klack.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --no-access-log
    environment:
      <<: *backend-environment
      # Docker Desktop and WSL bind mounts do not always propagate file-watch events.
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *json-logging

  identity-worker:
    build:
      context: ./backend
      target: development
    init: true
    restart: unless-stopped
    working_dir: /app
    command: ["/opt/venv/bin/klack-identity-worker", "run"]
    environment:
      <<: *backend-environment
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *json-logging

volumes:
  postgres_data:
